<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Music Player</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            background: #0b0b0b;
            color: white;

            font-family: Arial, Helvetica, sans-serif;

            overflow: hidden;
        }


        /* =========================================================
           MAIN LAYOUT
           ========================================================= */

        .app {
            display: flex;

            width: 100vw;
            height: 100vh;
        }


        /* =========================================================
           SIDEBAR
           ========================================================= */

        .sidebar {
            width: 320px;
            min-width: 320px;

            background: #111;

            border-right: 1px solid #252525;

            display: flex;
            flex-direction: column;
        }


        .library-header {
            padding: 20px;

            border-bottom: 1px solid #252525;
        }


        .library-title-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 6px;
            margin-bottom: 15px;
        }

        .library-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 0;
            margin-right: auto;
        }

        #favoritesFilterButton {
            width: 32px;
            height: 32px;
            flex: 0 0 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            background: #171717;
            color: #888;
            border: 1px solid #333;
            border-radius: 7px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        #favoritesFilterButton svg {
            width: 17px;
            height: 17px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #favoritesFilterButton:hover {
            background: #222;
            color: #ddd;
        }

        #favoritesFilterButton.active {
            background: #303030;
            color: #999;
            border-color: #777;
        }

        #favoritesFilterButton.active svg {
            fill: currentColor;
        }


        #playlistsButton {
            width: 32px;
            height: 32px;
            flex: 0 0 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            background: #171717;
            color: #888;
            border: 1px solid #333;
            border-radius: 7px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        #playlistsButton svg {
            width: 17px;
            height: 17px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #playlistsButton:hover,
        #playlistsButton.active {
            background: #222;
            color: #ddd;
            border-color: #777;
        }

        #playlistsPanel {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 10px 20px 20px;
        }

        #playlistsPanel[hidden],
        #library[hidden] {
            display: none !important;
        }

        .playlist-item {
    position: relative;
    margin-bottom: 3px;
}

.playlist-header {
    display: flex;
    align-items: center;
    gap: 4px;
}

.playlist-header .playlist-entry {
    flex: 1;
    min-width: 0;
}

.playlist-options-button {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #888;
    font-size: 20px;
    cursor: pointer;
}

.playlist-options-button:hover {
    background: #252525;
    color: white;
}

.playlist-options-menu {
    position: absolute;
    top: 36px;
    right: 4px;
    z-index: 100;
    min-width: 150px;
    padding: 4px;
    background: #222;
    border: 1px solid #383838;
    border-radius: 7px;
    box-shadow: 0 6px 18px #0008;
}

.playlist-options-menu button {
    width: 100%;
    padding: 9px 10px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: #ff5555;
    text-align: left;
    font: inherit;
    font-size: 13px;
    cursor: pointer;
}

.playlist-options-menu button:hover {
    background: #382020;
}

.playlist-options-menu[hidden] {
    display: none;
}


.playlist-entry {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 10px;
    text-align: left;
    background: transparent;
    color: #ccc;
    border: 0;
    border-radius: 6px;

    cursor: pointer;

.playlist-track {

    -webkit-appearance: none;

.playlist-track:disabled {

.playlist-tracks .song {

.playlist-tracks .song-title {

.playlist-tracks .song-artist {

}

        }

        /* =========================================================
           ARTIST
           ========================================================= */

        .artist {
            margin-bottom: 3px;
        }


        .artist-header {
            padding: 9px 10px;

            cursor: pointer;

            font-weight: bold;

            border-radius: 6px;

        }


        .artist-header:hover {

        }

        }

        /* =========================================================
           ALBUM
           ========================================================= */

        }


        .artist.open > .albums {
            display: block;
        }


        .album {
            margin-bottom: 2px;
        }


        .album-header {
            padding: 7px 8px;

            cursor: pointer;

            color: #cfcfcf;

            border-radius: 5px;

            user-select: none;
        }


        .album-header:hover {
            background: #1b1b1b;
        }


        .album-arrow {
            display: inline-block;

            width: 18px;

            transition: transform 0.15s;
        }


        .album.open > .album-header .album-arrow {
            transform: rotate(90deg);
        }


        /* =========================================================
           SONG
           ========================================================= */

        .songs {
            display: none;

            margin-left: 20px;
        }


        .album.open > .songs {
            display: block;
        }


        .song {
            padding: 7px 8px;

            cursor: pointer;

            border-radius: 5px;

            color: #999;

            font-size: 13px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            display: flex;

            align-items: center;

            gap: 8px;
        }


        .song:hover {
            background: #1b1b1b;

            color: white;
        }


        .song.active {
            background: #292929;

            color: white;

            font-weight: bold;
        }


        .song-title {
            overflow: hidden;

            text-overflow: ellipsis;
        }


        .song-artist {
            color: #666;

            font-size: 12px;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* =========================================================
           PLAYER AREA
           ========================================================= */

        .player-area {
            position: relative;

            flex: 1;

            min-width: 0;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            padding: 40px 0;
        }


        /* =========================================================
           BACKGROUND
           ========================================================= */

        .background {
            position: absolute;

            inset: -50px;

            background-position: center;

            background-size: cover;

            filter: blur(45px);

            opacity: 0.18;

            transform: scale(1.1);

            z-index: 0;
        }


        .background-overlay {
            position: absolute;

            inset: 0;

            background: rgba(0, 0, 0, 0.72);

            z-index: 1;
        }


        .player-content {
            position: relative;

            z-index: 2;

            width: min(700px, 90%);

            display: flex;

            flex-direction: column;

            align-items: center;

            transform: translateY(20px);

        }


        
/* COVER STAGE */

.cover-stage {
    position: relative;

    width: min(760px, 95%);
    height: min(500px, 58vh);

    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    perspective: 1000px;
    touch-action: none;
    overflow: visible !important;
}

/* ALBUM COVER FLOOR REFLECTION */

.cover-reflection {
    position: absolute;

    left: 50%;
    top: calc(50% + min(170px, 25vh));

    width: min(500px, 58vh);
    aspect-ratio: 1 / 1;

    object-fit: cover;
    display: block;

    /* Flip the artwork vertically */
    transform: translateX(-50%) perspective(700px) rotateX(15deg) scaleY(-1);
    transform-origin: center;

    /* Very faint reflection */
    opacity: 0.75;
    filter: blur(1.5px) brightness(0.65);

    /* Fade out as the reflection extends downward */
    -webkit-mask-image: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.35) 0%,
        rgba(0, 0, 0, 0.12) 35%,
        transparent 75%
    );

    mask-image: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.35) 0%,
        rgba(0, 0, 0, 0.12) 35%,
        transparent 75%
    );

    pointer-events: none;
    z-index: 1;
}

@media (max-width: 700px) {
    .cover-reflection {
        top: calc(50% + min(32vw, 100px));
        width: min(80vw, 400px);
    }
}

/* SIDE COVERS */

.side-cover {
    position: absolute;
    top: 50%;

    width: min(380px, 55%);
    aspect-ratio: 1 / 1;
    object-fit: cover;

    border-radius: 8px;
    opacity: 0.32;
    filter: brightness(0.6);

    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
    z-index: 1;
    pointer-events: none;

    backface-visibility: hidden;

    transition:
        opacity 0.45s ease,
        transform 0.45s ease,
        filter 0.45s ease;
    transform-style: preserve-3d;
}

/* VERTICAL ALBUM GHOST — SINGLE COVER */

.vertical-ghost {
    position: absolute;
    left: 50%;
    top: 50%;

    width: min(380px, 55%);
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 8px;

    /* Protrude above the main cover */
    transform:
        translate(-50%, -120%)
        rotateX(0deg)
        rotateY(0deg)
        rotateZ(0deg)
        scale(0.68);

transform-origin: center center;

    opacity: 0.32;
    filter: brightness(0.6);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);

    z-index: 1;
    pointer-events: none;
    backface-visibility: hidden;
}

.previous-cover {
    left: -80px;
    transform:
        perspective(900px)
        translateY(-50%)
        rotateY(36deg)
        scale(0.68);

    transform-origin: right center;
}


.next-cover {
    right: -80px;
    transform:
        perspective(900px)
        translateY(-50%)
        rotateY(-36deg)
        scale(0.68);
    object-fit: cover;

    transform-origin: left center;
}

    
/* SECOND-DEGREE HORIZONTAL GHOSTS */

.horizontal-ghost {
    position: absolute;
    top: 50%;

    width: min(270px, 38%);
    aspect-ratio: 1 / 1;
    object-fit: cover;

    border-radius: 8px;

    opacity: 0.18;
    filter: brightness(0.45) saturate(0.8);

    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);

    z-index: 0;
    pointer-events: none;
    backface-visibility: hidden;

    transition:
        left 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        right 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.45s ease,
        filter 0.45s ease;
}

/* Far-left cover: subtle perspective */
.previous-ghost {
    left: -90px;

    transform:
        translateY(-50%)
        rotateY(35deg)
        scale(0.9);

    transform-origin: right center;
}

/* Far-right cover: mirrored perspective */
.next-ghost {
    right: -90px;

    transform:
        translateY(-50%)
        rotateY(-35deg)
        scale(0.9);

    transform-origin: left center;
}

/* Mobile adjustments */
@media (max-width: 700px) {
    .horizontal-ghost {
        width: 35%;
        opacity: 0.15;
    }

    .previous-ghost {
        left: -65px;

        transform:
            translateY(-50%)
            rotateY(8deg)
            scale(0.55);
    }

    .next-ghost {
        right: -65px;

        transform:
            translateY(-50%)
            rotateY(-8deg)
            scale(0.55);
    }
}


/* MAIN COVER */
.cover-stage,
.cover-container {
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

.cover-container {
    position: relative;

    width: min(500px, 58vh);
    aspect-ratio: 1 / 1;

    border-radius: 8px;

    overflow: visible;

    background: #181818;

    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);

    z-index: 2;

    flex-shrink: 0;
}

/* MOBILE */

@media (max-width: 700px) {

    .cover-stage {
        width: 95%;
        height: min(80vw, 400px);
    }

    .cover-container {
        width: min(80vw, 400px);
    }

    .side-cover {
        width: 52%;
        opacity: 0.32;
    }

}

           BUFFER BAR
           ========================================================= */

        #bufferBar {
            position: absolute;

            left: 0;
            top: 8px;

            width: 0%;
            height: 4px;

            border-radius: 2px;

            background: #555;

            pointer-events: none;

            z-index: 1;
        }


        /* =========================================================
           EQUALIZER
           ========================================================= */
            #spectrumCanvas {
                position: absolute;

                left: 0;
                width: 100%;
                height: 75px;
                z-index: 3;
                pointer-events: none;
                opacity: 0.75;
            }
        /* =========================================================
           PLAYBACK SLIDER
           ========================================================= */
        #progress {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 20px;

            margin: 0;

            padding: 0;

            background: transparent;

            cursor: pointer;

            z-index: 2;

            appearance: none;
            -webkit-appearance: none;
        }


        /* =========================================================
           CHROME / EDGE SLIDER TRACK
           ========================================================= */

        #progress::-webkit-slider-runnable-track {
            width: 100%;

            height: 4px;

            background: transparent;

            border: none;

            border-radius: 2px;
        }

        
/* =========================================================
   TEXT SCROLL — TITLE, ARTIST, ALBUM
   ========================================================= */

#song-title,
#song-artist,
#song-album {
    width: 100%;
    overflow: hidden;
    white-space: nowrap;
    text-align: center;
}

#song-title {
    font-size: 25px;
    font-weight: bold;
}

#song-artist {
    margin-top: 7px;
    color: #aaa;
    font-size: 17px;
}

#song-album {
    margin-top: 4px;
    color: #666;
    font-size: 14px;
}

/* Apply the same scrolling animation to all three lines. */
#song-title .title-scroll,
#song-artist .title-scroll,
#song-album .title-scroll {
    display: inline-block;
    white-space: nowrap;
    will-change: transform;
    animation: title-marquee var(--scroll-duration, 8s)
               linear infinite alternate;
}

@keyframes title-marquee {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(var(--scroll-distance));
    }
}

@media (max-width: 700px) {
    #song-title {
        font-size: 20px;
    }
}

                opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .side-cover {
            transition:
                left 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                right 0.45s cubic-bezier(0.22, 1, 0.36, 1),

                opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                filter 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Moving to the next track */
        .cover-stage.animating-next .cover-container {
        animation: cover-out-left
        0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

        .cover-stage.animating-next .next-cover {
            animation: cover-in-from-right 0.7s
            cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

        .cover-stage.animating-next .previous-cover {
            animation: side-out-left 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Moving to the previous track */

        .cover-stage.animating-previous .cover-container {
        animation: cover-out-right
        0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

        .cover-stage.animating-previous .previous-cover {
            animation: cover-in-from-left 0.45s
            cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

        .cover-stage.animating-previous .next-cover {
            animation: side-out-right 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* Moving to the next track */
            @keyframes cover-out-left {

/* Incoming vertical ghost */
.cover-stage.animating-up .vertical-ghost,
.cover-stage.animating-down .vertical-ghost {
    z-index: 4;

    animation-duration: 700ms;
    animation-timing-function:
        cubic-bezier(0.22, 1, 0.36, 1);
    animation-fill-mode: both;
}

/* Current cover exits vertically */
.cover-stage.animating-up .cover-container {
    animation: album-current-up
        700ms cubic-bezier(0.22, 1, 0.36, 1) both;
}

.cover-stage.animating-down .cover-container {
    animation: album-current-down
        700ms cubic-bezier(0.22, 1, 0.36, 1) both;
}


/* Next album: ghost enters from below */
.cover-stage.animating-up .vertical-ghost {
    animation-name: album-next-up;
}

/* Previous album: ghost enters from above */
.cover-stage.animating-down .vertical-ghost {
    animation-name: album-previous-down;
}

/* Current cover leaves upward */
@keyframes album-current-up {
    from {
        transform: translate3d(0, 0, 0) scale(1);
        opacity: 1;
    }

    to {
        transform: translate3d(0, -110%, 0) scale(0.88);
        opacity: 0;
    }
}

@keyframes album-current-down {
    from {
        transform: translate3d(0, 0, 0) scale(1);
        opacity: 1;
    }

    to {
        transform: translate3d(0, 110%, 0) scale(0.88);
        opacity: 0;
    }
}

            translate3d(-50%, -50%, 0)

        opacity: 1;
        filter: brightness(1);

}

        opacity: 0.32;

function updateMediaSession(song) {
    if (!("mediaSession" in navigator)) return;

    const artwork = song.cover
        ? new URL(encodeURI(song.cover), document.baseURI).href
        : null;

    navigator.mediaSession.metadata = new MediaMetadata({
        title: song.title || "Unknown Title",
        artist: song.artist || "Unknown Artist",
        album: song.album || "Unknown Album",
        artwork: artwork
            ? [
                {
                    src: artwork,
                    sizes: "512x512",
                    type: "image/jpeg"
                }
            ]
            : []
    });
}

if ("mediaSession" in navigator) {
    navigator.mediaSession.setActionHandler("play", () => {
        player.play().catch(console.warn);
    });

    navigator.mediaSession.setActionHandler("pause", () => {
    player.pause();

    navigator.mediaSession.playbackState = "paused";
    });

    navigator.mediaSession.setActionHandler("nexttrack", () => {
        nextSong();
    });

    navigator.mediaSession.setActionHandler("previoustrack", () => {
        const sequence = getPlaybackSequence();
        const position = sequence.indexOf(currentSong);

        if (position === -1 || sequence.length === 0) return;

        const previousPosition =
            (position - 1 + sequence.length) % sequence.length;

        playSong(sequence[previousPosition]);
    });
}

/* ============================================================

   ============================================================ */

function buildLibrary() {

    library = {};


    songs.forEach((song, index) => {

        const albumArtist =
            song.albumartist ||
            "Unknown Album Artist";


        const album =
            song.album ||
            "Unknown Album";


        if (!library[albumArtist]) {

            library[albumArtist] = {};

        }


        if (!library[albumArtist][album]) {

            library[albumArtist][album] = [];

        }


        library[albumArtist][album].push({

            ...song,

            index: index

        });

    });

}



/* ============================================================
   RENDER LIBRARY
   ============================================================ */

function renderLibrary(filter = "") {

    libraryElement.innerHTML = "";


    const query =
        filter.toLowerCase().trim();


    const albumArtists =
        Object.keys(library).sort(
            (a, b) =>
                a.localeCompare(b)
        );


    albumArtists.forEach(albumArtist => {


        const artistElement =
            document.createElement("div");

        artistElement.className =
            "artist";


        /* ARTIST HEADER */

        const artistHeader =
            document.createElement("div");

        artistHeader.className =
            "artist-header";


        artistHeader.innerHTML =
            `<span class="artist-arrow">▶</span>
             ${escapeHTML(albumArtist)}`;


        artistElement.appendChild(
            artistHeader
        );



        /* ALBUMS */

        const albumsElement =
            document.createElement("div");

        albumsElement.className =
            "albums";


        const albums =
            Object.keys(
                library[albumArtist]
            ).sort(
                (a, b) =>
                    a.localeCompare(b)
            );


        albums.forEach(album => {


            const albumSongs =
                library[
                    albumArtist
                ][
                    album
                ];


            const matchingSongs =
                albumSongs.filter(song =>
                    (!showFavoritesOnly || Boolean(song.favorite)) &&
                    matchesSearch(song, query)
                );


            if (
                (query || showFavoritesOnly) &&
                matchingSongs.length === 0
            ) {

                return;

            }



            /* ALBUM */

            const albumElement =
                document.createElement("div");

            albumElement.className =
                "album";


            const albumHeader =
                document.createElement("div");

            albumHeader.className =
                "album-header";


            albumHeader.innerHTML =
                `<span class="album-arrow">▶</span>
                 ${escapeHTML(album)}`;


            albumElement.appendChild(
                albumHeader
            );



            /* SONGS */

            const songsElement =
                document.createElement("div");

            songsElement.className =
                "songs";


            const visibleSongs =
                (query || showFavoritesOnly)
                    ? matchingSongs
                    : albumSongs;


            visibleSongs.forEach(song => {


                const songElement =
                    document.createElement("div");

                songElement.className =
                    "song";


                songElement.dataset.index =
                    song.index;



                const titleElement =
                    document.createElement("span");

                titleElement.className =
                    "song-title";

                titleElement.textContent =
                    song.title ||
                    "Unknown Title";



                const artistElement =
                    document.createElement("span");

                artistElement.className =
                    "song-artist";

                artistElement.textContent =
                    song.artist ||
                    "Unknown Artist";



                songElement.appendChild(
                    titleElement
                );


                songElement.appendChild(
                    artistElement
                );



                songElement.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();
                        playlistQueue = null;
                        playSong(song.index);

                    }
                );


                songsElement.appendChild(
                    songElement
                );

            });


            albumElement.appendChild(
                songsElement
            );



            /* ALBUM OPEN/CLOSE */

            albumHeader.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    albumElement.classList.toggle(
                        "open"
                    );

                }
            );


            albumsElement.appendChild(
                albumElement
            );

        });


        artistElement.appendChild(
            albumsElement
        );



        /* ARTIST OPEN/CLOSE */

        artistHeader.addEventListener(
            "click",
            () => {

                artistElement.classList.toggle(
                    "open"
                );

            }
        );


        if (
    (!query && !showFavoritesOnly) ||
    albumsElement.children.length > 0
) {
    libraryElement.appendChild(artistElement);
}

    });


    updateSongList();

}



/* ============================================================
   SEARCH
   ============================================================ */

function matchesSearch(song, query) {

    if (!query) {

        return true;

    }


    const text = (

        (song.title || "") +
        " " +
        (song.artist || "") +
        " " +
        (song.album || "") +
        " " +
        (song.genre || "")

    ).toLowerCase();


    return text.includes(query);

}

function validPlaylistName(name) {
    // Names become SQLite table names, so allow ordinary names without SQL punctuation.
    return /^[\p{L}\p{N} _-]{1,64}$/u.test(name);
}

        playlistsList.replaceChildren();

header.className = "playlist-header";

deleteButton.addEventListener("click", async event => {
    event.stopPropagation();

    if (!confirm(`Delete playlist "${name}"?`)) return;

    try {
        const response = await fetch(`${playlistsApiUrl}/delete`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ name })
        });

        const result = await response.json();

        if (!response.ok || result.success !== true) {
            throw new Error(result.error || "Could not delete playlist.");
        }

        await loadPlaylists();
    } catch (error) {
        showToast(error.message, "error");
    }
});

renameButton.addEventListener("click", async event => {
    event.stopPropagation();

    const newName = prompt("Enter a new playlist name:", name);
    if (newName === null || !newName.trim()) return;

    try {
        const response = await fetch(`${playlistsApiUrl}/rename`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                old_name: name,
                new_name: newName.trim()
            })
        });

        const result = await response.json();

        if (!response.ok || result.success !== true) {
            throw new Error(result.error || "Could not rename playlist.");
        }
        showToast("Playlist Renamed Successfully.", "success");
        await loadPlaylists();
    } catch (error) {
        showToast(error.message, "error");

/* ============================================================
   ALBUM NAVIGATION
   ============================================================ */

function getAlbumSequence() {
    const albums = [];

    const albumArtists = Object.keys(library).sort(
        (a, b) => a.localeCompare(b)
    );

    albumArtists.forEach(albumArtist => {
        const albumNames = Object.keys(
            library[albumArtist]
        ).sort((a, b) => a.localeCompare(b));

        albumNames.forEach(album => {
            albums.push({
                albumArtist,
                album,
                songs: library[albumArtist][album]
            });
        });
    });

    return albums;
}


function getAdjacentAlbumTrack(direction) {
    if (currentSong < 0 || songs.length === 0) return null;

    const albums = getAlbumSequence();
    if (albums.length < 2) return null;

    const currentTrack = songs[currentSong];

    const currentAlbumArtist =
        currentTrack.albumartist || "Unknown Album Artist";

    const currentAlbum =
        currentTrack.album || "Unknown Album";

    const currentPosition = albums.findIndex(album =>
        album.albumArtist === currentAlbumArtist &&
        album.album === currentAlbum
    );

    if (currentPosition === -1) return null;

    const targetPosition =
        (currentPosition + direction + albums.length) % albums.length;

    return albums[targetPosition].songs[0] || null;
}

function showAlbumGhost(direction, targetTrack = null) {
    targetTrack ??= getAdjacentAlbumTrack(direction);

    if (targetTrack?.cover) {
        verticalGhost.src = encodeURI(targetTrack.cover);
    } else {
        verticalGhost.removeAttribute("src");
    }
}

let shuffleAlbumIndex = null;

function updateVerticalGhost() {
    const albums = getAlbumSequence();

    if (albums.length === 0) {
        verticalGhost.removeAttribute("src");
        shuffleAlbumIndex = null;
        return;
    }

    if (playbackMode === "shuffle") {
        shuffleAlbumIndex = Math.floor(
            Math.random() * albums.length
        );

        const targetTrack = albums[shuffleAlbumIndex].songs[0];

        if (targetTrack?.cover) {
            verticalGhost.src = encodeURI(targetTrack.cover);
        } else {
            verticalGhost.removeAttribute("src");
        }

        return;
    }

    shuffleAlbumIndex = null;

    const targetTrack = getAdjacentAlbumTrack(-1);

    if (targetTrack?.cover) {
        verticalGhost.src = encodeURI(targetTrack.cover);
    } else {
        verticalGhost.removeAttribute("src");
    }
}

function changeAlbum(direction) {
    const albums = getAlbumSequence();
    const currentTrack = songs[currentSong];

    if (albums.length === 0 || !currentTrack) return;

    let targetTrack;

    if (playbackMode === "shuffle") {
    // Reuse the album currently shown by the vertical ghost.
    if (shuffleAlbumIndex === null) {
        updateVerticalGhost();
    }

    targetTrack = albums[shuffleAlbumIndex]?.songs[0] || null;
    }
    
    else {
        // Preserve sequential album navigation.
        targetTrack = getAdjacentAlbumTrack(direction);
    }

    if (!targetTrack) return;

    showAlbumGhost(direction, targetTrack);

    animateCover(
        direction > 0 ? "up" : "down",
        () => playSong(targetTrack.index)
    );
}

function nextAlbum() {
    changeAlbum(1);
}


function previousAlbum() {
    changeAlbum(-1);
}


function getPlaybackSequence() {

    const sequence = [];

    const albumArtists =
        Object.keys(library).sort(
            (a, b) => a.localeCompare(b)
        );

    albumArtists.forEach(albumArtist => {

        const albums =
            Object.keys(library[albumArtist]).sort(
                (a, b) => a.localeCompare(b)
            );

        albums.forEach(album => {

            library[albumArtist][album].forEach(song => {
                sequence.push(song.index);
            });

        });

    });

    return sequence;
}


/* ============================================================
   UPDATE SIDE COVERS
   ============================================================ */


function updateSideCovers() {
    const sequence = getPlaybackSequence();
    const position = sequence.indexOf(currentSong);
    const total = sequence.length;

    if (position === -1 || total < 2) {
        previousCover.removeAttribute("src");
        nextCover.removeAttribute("src");
        previousGhost.removeAttribute("src");
        nextGhost.removeAttribute("src");

        shuffleNextIndex = null;
        shufflePreviousIndex = null;
        return;
    }

    function setCoverImage(element, song) {
        if (song?.cover) {
            element.src = encodeURI(song.cover);
        } else {
            element.removeAttribute("src");
        }
    }

    // SHUFFLE: randomize the side covers and ghosts.
    if (playbackMode === "shuffle") {
        shufflePreviousIndex = randomTrackIndex(currentSong);
        shuffleNextIndex = randomTrackIndex(currentSong);

        setCoverImage(previousCover, songs[shufflePreviousIndex]);
        setCoverImage(nextCover, songs[shuffleNextIndex]);

        setCoverImage(
            previousGhost,
            songs[randomTrackIndex(currentSong)]
        );

        setCoverImage(
            nextGhost,
            songs[randomTrackIndex(currentSong)]
        );

        return;
    }

    // SEQUENTIAL / REPEAT: preserve existing artwork order.
    shuffleNextIndex = null;
    shufflePreviousIndex = null;

    const previousPosition = (position - 1 + total) % total;
    const nextPosition = (position + 1) % total;

    const previousSong = songs[sequence[previousPosition]];
    const nextSong = songs[sequence[nextPosition]];

    const previousGhostPosition = (position - 2 + total) % total;
    const nextGhostPosition = (position + 2) % total;

    const previousGhostSong = songs[sequence[previousGhostPosition]];
    const nextGhostSong = songs[sequence[nextGhostPosition]];

    setCoverImage(previousCover, previousSong);
    setCoverImage(nextCover, nextSong);

    if (total >= 4) {
        setCoverImage(previousGhost, previousGhostSong);
        setCoverImage(nextGhost, nextGhostSong);
    } else {
        previousGhost.removeAttribute("src");
        nextGhost.removeAttribute("src");
    }
}

    function randomTrackIndex(excludeIndex = -1) {
    if (songs.length <= 1) return 0;

    let index;

    do {
        index = Math.floor(Math.random() * songs.length);
    } while (index === excludeIndex);

    return index;
}

/* =========================================================
   SCROLLING TEXT
   ========================================================= */

function updateScrollingText(element, content) {
    element.replaceChildren();

    const text = document.createElement("span");
    text.textContent = content;
    element.appendChild(text);

    requestAnimationFrame(() => {
        const availableWidth = element.clientWidth;
        const textWidth = text.getBoundingClientRect().width;
        const overflow = textWidth - availableWidth;

        if (overflow > 2) {
            text.classList.add("title-scroll");

            text.style.setProperty(
                "--scroll-distance",
                `-${overflow}px`
            );

            // Longer text scrolls more slowly.
            text.style.setProperty(
                "--scroll-duration",
                `${Math.max(6, overflow / 15)}s`
            );
        }
    });
}

let coverAnimationTimer;
let coverAnimating = false;
let shuffleNextIndex = null;
let shufflePreviousIndex = null;

function animateCover(direction, callback) {
    const stage = coverStage;

    if (!stage || coverAnimating) {
        return;
    }

    coverAnimating = true;

    clearTimeout(coverAnimationTimer);

    stage.classList.remove(
        "animating-next",
        "animating-previous",
        "animating-up",
        "animating-down",
        "vertical-drag-up",
        "vertical-drag-down"
    );

// Preserve the released horizontal drag position.
// Vertical album animations start from their own positions.
dragCover.style.transition = "";

if (direction === "up" || direction === "down") {
    dragCover.style.transform = "";
    dragCover.style.removeProperty("--drag-offset");
}

    stage.style.removeProperty("--ghost-opacity");
    stage.style.removeProperty("--drag-y");

    // Reset the previous animation before starting another.
    void stage.offsetWidth;

    if (direction === "up") {
        stage.classList.add("animating-up");
    } else if (direction === "down") {
        stage.classList.add("animating-down");
    } else if (direction === "next") {
        stage.classList.add("animating-next");
    } else if (direction === "previous") {
        stage.classList.add("animating-previous");
    } else {
        coverAnimating = false;
        return;
    }

    coverAnimationTimer = setTimeout(() => {
        stage.classList.remove(
            "animating-next",
            "animating-previous",
            "animating-up",
            "animating-down"
        );

        // Remove animation styles before updating the artwork.
        dragCover.style.animation = "";
        dragCover.style.transform = "";
        dragCover.style.transition = "";
        dragCover.style.removeProperty("--drag-offset");

        coverAnimating = false;

        if (callback) {
            callback();
        }
    }, 700);
}

async function toggleFavorite() {

    updateFavoriteButton();

                favorite: nextFavorite
            })
        });

        const result = await response.json().catch(() => ({}));

        if (!response.ok || result.success !== true) {
            throw new Error(result.error || `HTTP ${response.status}`);
        }

        // Update the in-memory library only after Flask confirms the save.
        song.favorite = nextFavorite;

        // buildLibrary() stores copies, so sync the matching library entry too.
        Object.values(library).forEach(albums => {
            Object.values(albums).forEach(albumSongs => {
                albumSongs.forEach(track => {
                    if (track.index === currentSong) {
                        track.favorite = nextFavorite;

                });

        // If filtering favorites, immediately reflect a like/unlike in the list.
        if (showFavoritesOnly) {

        updateFavoriteButton();

        if (nextFavorite) {
            spinAlbumCover();
        }
    } catch (error) {
        console.error("Could not update favorite status:", error);
        favoriteButton.title = "Could not save favorite — check that favorites_api.py is running";
    } finally {
        favoriteRequestInProgress = false;
        updateFavoriteButton();
    }
}

    if (playlistQueue) {

    if (songs.length === 0) return;

    if (playbackMode === "repeat") {
        playSong(currentSong);
        return;
    }

    if (playbackMode === "shuffle") {
    const previousIndex =
        shufflePreviousIndex ?? randomTrackIndex(currentSong);

    animateCover("previous", () => {
        playSong(previousIndex);
    });

    return;
}

    const sequence = getPlaybackSequence();
    const currentPosition = sequence.indexOf(currentSong);

    if (currentPosition === -1) return;

    const previousPosition =
        (currentPosition - 1 + sequence.length) % sequence.length;

    animateCover("previous", () => {
        playSong(sequence[previousPosition]);
    });
});


/* ============================================================
   MOUSE DRAG + MOBILE SWIPE CONTROLS
   ============================================================ */

const dragCover = document.querySelector(".cover-container");

let swipeStartX = 0;
let swipeStartY = 0;
let swipePointerId = null;

let dragDistanceX = 0;
let dragDistanceY = 0;
let swipeAxis = null;
let tapStartedOnArtwork = false;

const SWIPE_THRESHOLD = 50;
const DIRECTION_THRESHOLD = 8;
const DRAG_THRESHOLD = 0.25;

coverStage.addEventListener("pointerdown", (event) => {
    // Keep the existing mobile behavior.
    // Add mouse dragging on desktop.
    if (event.pointerType === "touch") {
        if (coverAnimating || currentSong < 0) return;
    } else if (event.pointerType === "mouse") {
        if (event.button !== 0 || coverAnimating || currentSong < 0) return;
    } else {
        return;
    }

    swipeStartX = event.clientX;
    swipeStartY = event.clientY;
    tapStartedOnArtwork = event.target === cover;

    dragDistanceX = 0;
    dragDistanceY = 0;
    swipeAxis = null;
    swipePointerId = event.pointerId;

    dragCover.style.transition = "none";

    coverStage.setPointerCapture(event.pointerId);
    event.preventDefault();
});

coverStage.addEventListener("pointermove", (event) => {
    if (event.pointerId !== swipePointerId) return;

    const dx = event.clientX - swipeStartX;
    const dy = event.clientY - swipeStartY;

    dragDistanceX = dx;
    dragDistanceY = dy;

    if (
        swipeAxis === null &&
        Math.max(Math.abs(dx), Math.abs(dy)) >= DIRECTION_THRESHOLD
    ) {
        swipeAxis =
            Math.abs(dx) > Math.abs(dy)
                ? "horizontal"
                : "vertical";
    }

    if (swipeAxis === "horizontal") {
        const width = dragCover.getBoundingClientRect().width;
        const rotation = dx * -0.06;
        const scale = 1 - Math.min(
            Math.abs(dx) / width * 0.08,
            0.08
        );

        dragCover.style.transform =
            `translate(${dx}px, 0px) rotateY(${rotation}deg) scale(${scale})`;
    } else if (swipeAxis === "vertical") {
        const height = dragCover.getBoundingClientRect().height;
        const rotation = dy * 0.04;
        const scale = 1 - Math.min(
            Math.abs(dy) / height * 0.08,
            0.08
        );

        dragCover.style.transform =
            `translate(0px, ${dy}px) rotateX(${rotation}deg) scale(${scale})`;
    }
});

function resetCoverDrag() {
    dragCover.style.transition = "";
    dragCover.style.transform = "";
    dragCover.style.removeProperty("--drag-offset");
}

function finishCoverSwipe(event) {
    if (event.pointerId !== swipePointerId) return;

    const dx = dragDistanceX;
    const dy = dragDistanceY;
    const axis = swipeAxis;

    swipePointerId = null;

    if (!axis) {
        resetCoverDrag();

        // Two quick taps/clicks directly on the artwork toggle its favorite state.
        if (tapStartedOnArtwork && event.pointerType !== "pen") {
            const now = performance.now();
            if (now - lastCoverTapTime <= 320) {
                lastCoverTapTime = 0;
                toggleFavorite();
            } else {
                lastCoverTapTime = now;
            }
        }

        tapStartedOnArtwork = false;
        return;
    }

    tapStartedOnArtwork = false;

    if (axis === "vertical") {
        if (Math.abs(dy) >= SWIPE_THRESHOLD) {
            // Reset the temporary drag before the album animation.
            resetCoverDrag();

            if (dy < 0) {
                nextAlbum();
            } else {
                previousAlbum();
            }
        } else {
            resetCoverDrag();
        }

        return;
    }

    if (axis === "horizontal") {
        const width = dragCover.getBoundingClientRect().width;
        const threshold = Math.max(
            SWIPE_THRESHOLD,
            width * DRAG_THRESHOLD
        );

        if (Math.abs(dx) >= threshold) {
            // Preserve the released position for the existing animation.
            dragCover.style.setProperty("--drag-offset", `${dx}px`);

            if (dx < 0) {
                nextButton.click();
            } else {
                previousButton.click();
            }
        } else {
            dragCover.style.transition =
                "transform 0.25s cubic-bezier(0.22, 1, 0.36, 1)";

            dragCover.style.transform =
                "translate(0px, 0px) rotateY(0deg) scale(1)";

            dragCover.addEventListener("transitionend", function resetDrag() {
                dragCover.removeEventListener("transitionend", resetDrag);
                resetCoverDrag();
            }, { once: true });
        }
    }
}

coverStage.addEventListener("pointerup", finishCoverSwipe);

coverStage.addEventListener("pointercancel", (event) => {
    if (event.pointerId !== swipePointerId) return;

    swipePointerId = null;
    swipeAxis = null;
    resetCoverDrag();
});

/* ============================================================
   GET BUFFERED END
   ============================================================ */

function getBufferedEnd() {


    if (
        player.buffered.length === 0
    ) {

        return 0;

    }



    /*
     * Find the buffered range containing
     * the current playback position.
     */

    for (
        let i = 0;
        i < player.buffered.length;
        i++
    ) {


        if (
            player.currentTime >=
                player.buffered.start(i)

            &&

            player.currentTime <=
                player.buffered.end(i)
        ) {

            return player.buffered.end(i);

        }

    }



    /*
     * If current playback position isn't
     * inside a buffered range, use the
     * last buffered range.
     */

    return player.buffered.end(
        player.buffered.length - 1
    );

}
/* ============================================================

   ============================================================ */
    const spectrumCanvas = document.getElementById("spectrumCanvas");
const spectrumCtx = spectrumCanvas.getContext("2d");

let spectrumAudioContext;
let spectrumAnalyser;
let spectrumSource;
let spectrumData;
let spectrumColours = [];
let spectrumAnimationId;

const BAR_COUNT = 48;

function setupSpectrumAnalyzer() {
    if (!spectrumAudioContext) {
        spectrumAudioContext = new AudioContext();

        spectrumAnalyser = spectrumAudioContext.createAnalyser();
        spectrumAnalyser.fftSize = 2048;
        spectrumAnalyser.smoothingTimeConstant = 0.85;

        // Connect the existing audio element only once.
        spectrumSource =
            spectrumAudioContext.createMediaElementSource(player);

        spectrumSource.connect(spectrumAnalyser);
        spectrumAnalyser.connect(spectrumAudioContext.destination);

        spectrumData = new Uint8Array(
            spectrumAnalyser.frequencyBinCount
        );
    }

    spectrumAudioContext.resume();
    resizeSpectrumCanvas();
    drawSpectrum();
}

function resizeSpectrumCanvas() {
    const rect = spectrumCanvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;

    spectrumCanvas.width = Math.round(rect.width * dpr);
    spectrumCanvas.height = Math.round(rect.height * dpr);

    spectrumCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function sampleCoverColours() {
    if (!cover.complete || !cover.naturalWidth) return;

    try {
        const sampleCanvas = document.createElement("canvas");
        sampleCanvas.width = BAR_COUNT;
        sampleCanvas.height = 1;

        const sampleCtx = sampleCanvas.getContext("2d", {
            willReadFrequently: true
        });

        sampleCtx.drawImage(
            cover,
            0, 0,
            cover.naturalWidth,
            cover.naturalHeight,
            0, 0,
            BAR_COUNT, 1
        );

        const pixels = sampleCtx.getImageData(
            0, 0, BAR_COUNT, 1
        ).data;

        spectrumColours = [];

        for (let i = 0; i < BAR_COUNT; i++) {
            const p = i * 4;

            spectrumColours.push(
                `rgb(${pixels[p]}, ${pixels[p + 1]}, ${pixels[p + 2]})`
            );
        }
    } catch (error) {
        // Fallback if the browser prevents reading the artwork.
        spectrumColours = Array.from(
            { length: BAR_COUNT },
            (_, i) => `hsl(${190 + i * 2}, 75%, 60%)`
        );
    }
}

function drawSpectrum() {
    cancelAnimationFrame(spectrumAnimationId);

    const width = spectrumCanvas.clientWidth;
    const height = spectrumCanvas.clientHeight;

    spectrumAnalyser.getByteFrequencyData(spectrumData);
    spectrumCtx.clearRect(0, 0, width, height);

    const barWidth = width / BAR_COUNT;
    const gap = Math.max(1, barWidth * 0.12);

    for (let i = 0; i < BAR_COUNT; i++) {
        // Spread bars across the frequency range logarithmically.
        const start = Math.floor(
            Math.pow(i / BAR_COUNT, 2) *
            spectrumAnalyser.frequencyBinCount
        );

        const end = Math.max(
            start + 1,
            Math.floor(
                Math.pow((i + 1) / BAR_COUNT, 2) *
                spectrumAnalyser.frequencyBinCount
            )
        );

        let sum = 0;

        for (let j = start; j < end; j++) {
            sum += spectrumData[j];
        }

        const level = sum / (end - start);
        const barHeight = Math.max(2, (level / 255) * height);

        const x = i * barWidth;
        const y = height - barHeight;

        spectrumCtx.fillStyle = "rgba(200, 200, 200, 0.65)";

        spectrumCtx.fillRect(
            x + gap / 2,
            y,
            Math.max(1, barWidth - gap),
            barHeight
        );
    }

    spectrumCtx.globalAlpha = 1;
    spectrumAnimationId = requestAnimationFrame(drawSpectrum);
}


/* ============================================================
   UPDATE BUFFER BAR
   ============================================================ */

function updateBufferBar() {


    if (
        !Number.isFinite(
            player.duration
        )

        ||

        player.duration <= 0

        ||

        player.buffered.length === 0
    ) {

        bufferBar.style.width =
            "0%";

        return;

    }



    const bufferedEnd =
        getBufferedEnd();


    const percentage =
        (
            bufferedEnd /
            player.duration
        ) * 100;


    bufferBar.style.width =
        Math.min(
            100,
            percentage
        ) + "%";

}

/* ============================================================
   NETWORK SPEED
   ============================================================ */

setInterval(
    () => {


        /*
         * We need:
         *
         * 1. Song duration
         * 2. Song file size
         * 3. Some buffered data
         */

        if (
            !Number.isFinite(
                player.duration
            )

            ||

            !currentSongSize

            ||

            player.buffered.length === 0
        ) {

            downloadSpeed.textContent =
                "Buffering: -- MB/s";

            return;

        }



        const bufferedEnd =
            getBufferedEnd();


        const now =
            performance.now();


        const elapsed =
            (
                now -
                lastSpeedTime
            ) / 1000;


        const bufferedGrowth =
            bufferedEnd -
            lastBufferedEnd;



        /*
         * Buffer has grown.
         */

        if (
            elapsed > 0 &&
            bufferedGrowth > 0
        ) {


            /*
             * Estimate how many bytes
             * one second of audio represents.
             */

            const bytesPerAudioSecond =
                currentSongSize /
                player.duration;



            /*
             * How many audio seconds are
             * being buffered per real second.
             */

            const audioSecondsPerSecond =
                bufferedGrowth /
                elapsed;



            /*
             * Estimated bytes per second.
             */

            const bytesPerSecond =
                bytesPerAudioSecond *
                audioSecondsPerSecond;



            const mbPerSecond =
                bytesPerSecond /
                (1024 * 1024);



            downloadSpeed.textContent =
                "Buffering: " +
                mbPerSecond.toFixed(2) +
                " MB/s";

        }

        else {

            downloadSpeed.textContent =
                "Buffering: 0.00 MB/s";

        }



        /*
         * Save measurement.
         */

        lastBufferedEnd =
            bufferedEnd;


        lastSpeedTime =
            now;


    },
    250
);



/* ============================================================
   FORMAT TIME
   ============================================================ */

function formatTime(seconds) {


    if (
        !Number.isFinite(seconds)
    ) {

        return "0:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return (
        minutes +
        ":" +
        secs
            .toString()
            .padStart(2, "0")
    );

}



/* ============================================================
   HTML ESCAPING
   ============================================================ */

function escapeHTML(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

let toastTimeout;

function showToast(message, type = "") {
    const toast = document.getElementById("toastNotification");

    toast.textContent = message;
    toast.className = "toast-notification";

    if (type) {
        toast.classList.add(type);
    }

    // Restart the animation if another toast is already visible.
    void toast.offsetWidth;

    toast.classList.add("show");

    clearTimeout(toastTimeout);

    toastTimeout = setTimeout(() => {
        toast.classList.remove("show");
    }, 3000);
}

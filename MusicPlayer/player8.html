<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Music Player</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            background: #0b0b0b;
            color: white;

            font-family: Arial, Helvetica, sans-serif;

            overflow: hidden;
        }


        /* =========================================================
           MAIN LAYOUT
           ========================================================= */

        .app {
            display: flex;

            width: 100vw;
            height: 100vh;
        }


        /* =========================================================
           SIDEBAR
           ========================================================= */

        .sidebar {
            width: 320px;
            min-width: 320px;

            background: #111;

            border-right: 1px solid #252525;

            display: flex;
            flex-direction: column;
        }


        .library-header {
            padding: 20px;

            border-bottom: 1px solid #252525;
        }


        .library-title {
            font-size: 22px;
            font-weight: bold;

            margin-bottom: 15px;
        }


        #search {
            width: 100%;

            padding: 11px 13px;

            background: #1d1d1d;
            color: white;

            border: 1px solid #333;
            border-radius: 7px;

            outline: none;

            font-size: 14px;
        }


        #search:focus {
            border-color: #666;
        }


        #library {
            flex: 1;

            overflow-y: auto;

            padding: 10px;
        }


        #library::-webkit-scrollbar {
            width: 8px;
        }


        #library::-webkit-scrollbar-track {
            background: #111;
        }


        #library::-webkit-scrollbar-thumb {
            background: #333;

            border-radius: 5px;
        }


        /* =========================================================
           ARTIST
           ========================================================= */

        .artist {
            margin-bottom: 3px;
        }


        .artist-header {
            padding: 9px 10px;

            cursor: pointer;

            font-weight: bold;

            border-radius: 6px;

            user-select: none;
        }


        .artist-header:hover {
            background: #1d1d1d;
        }


        .artist-arrow {
            display: inline-block;

            width: 18px;

            transition: transform 0.15s;
        }


        .artist.open > .artist-header .artist-arrow {
            transform: rotate(90deg);
        }


        /* =========================================================
           ALBUM
           ========================================================= */

        .albums {
            display: none;

            margin-left: 18px;
        }


        .artist.open > .albums {
            display: block;
        }


        .album {
            margin-bottom: 2px;
        }


        .album-header {
            padding: 7px 8px;

            cursor: pointer;

            color: #cfcfcf;

            border-radius: 5px;

            user-select: none;
        }


        .album-header:hover {
            background: #1b1b1b;
        }


        .album-arrow {
            display: inline-block;

            width: 18px;

            transition: transform 0.15s;
        }


        .album.open > .album-header .album-arrow {
            transform: rotate(90deg);
        }


        /* =========================================================
           SONG
           ========================================================= */

        .songs {
            display: none;

            margin-left: 20px;
        }


        .album.open > .songs {
            display: block;
        }


        .song {
            padding: 7px 8px;

            cursor: pointer;

            border-radius: 5px;

            color: #999;

            font-size: 13px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            display: flex;

            align-items: center;

            gap: 8px;
        }


        .song:hover {
            background: #1b1b1b;

            color: white;
        }


        .song.active {
            background: #292929;

            color: white;

            font-weight: bold;
        }


        .song-title {
            overflow: hidden;

            text-overflow: ellipsis;
        }


        .song-artist {
            color: #666;

            font-size: 12px;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        /* =========================================================
           PLAYER AREA
           ========================================================= */

        .player-area {
            position: relative;

            flex: 1;

            min-width: 0;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            padding: 40px 0;
        }


        /* =========================================================
           BACKGROUND
           ========================================================= */

        .background {
            position: absolute;

            inset: -50px;

            background-position: center;

            background-size: cover;

            filter: blur(45px);

            opacity: 0.18;

            transform: scale(1.1);

            z-index: 0;
        }


        .background-overlay {
            position: absolute;

            inset: 0;

            background: rgba(0, 0, 0, 0.72);

            z-index: 1;
        }


        .player-content {
            position: relative;

            z-index: 2;

            width: min(700px, 90%);

            display: flex;

            flex-direction: column;

            align-items: center;

            transform: translateY(20px);

        }


        
/* COVER STAGE */

.cover-stage {
    position: relative;

    width: min(760px, 95%);
    height: min(500px, 58vh);

    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}


/* SIDE COVERS */

.side-cover {
    position: absolute;

    top: 50%;

    width: min(380px, 55%);
    aspect-ratio: 1 / 1;

    object-fit: cover;

    border-radius: 8px;

    opacity: 0.38;

    filter: brightness(0.65);

    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);

    z-index: 1;

    pointer-events: none;

    transition:
        opacity 0.3s ease,
        transform 0.3s ease;
}


.previous-cover {
    left: 0;

    transform: translateY(-50%) scale(0.78);
}


.next-cover {
    right: 0;

    transform: translateY(-50%) scale(0.78);
}


/* MAIN COVER */

.cover-container {
    position: relative;

    width: min(500px, 58vh);
    aspect-ratio: 1 / 1;

    border-radius: 8px;

    overflow: hidden;

    background: #181818;

    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);

    z-index: 2;

    flex-shrink: 0;
}


/* MOBILE */

@media (max-width: 700px) {

    .cover-stage {
        width: 95%;
        height: min(80vw, 400px);
    }

    .cover-container {
        width: min(80vw, 400px);
    }

    .side-cover {
        width: 52%;
        opacity: 0.32;
    }

}



        #cover {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }


        /* =========================================================
           SONG INFO
           ========================================================= */

        .song-info {
            width: 100%;

            margin-top: 20px;

            text-align: center;
        }


        #song-title {
            font-size: 25px;

            font-weight: bold;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        #song-artist {
            margin-top: 7px;

            color: #aaa;

            font-size: 17px;
        }


        #song-album {
            margin-top: 4px;

            color: #666;

            font-size: 14px;
        }


        /* =========================================================
           PROGRESS AREA
           ========================================================= */

        .progress-container {
            position: relative;

            width: 100%;

            height: 20px;

            margin-top: 25px;
        }


        /* =========================================================
           BUFFER BAR
           ========================================================= */

        #bufferBar {
            position: absolute;

            left: 0;
            top: 8px;

            width: 0%;
            height: 4px;

            border-radius: 2px;

            background: #555;

            pointer-events: none;

            z-index: 1;
        }


        /* =========================================================
           PLAYBACK SLIDER
           ========================================================= */

        #progress {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 20px;

            margin: 0;

            padding: 0;

            background: transparent;

            cursor: pointer;

            z-index: 2;

            appearance: none;
            -webkit-appearance: none;
        }


        /* =========================================================
           CHROME / EDGE SLIDER TRACK
           ========================================================= */

        #progress::-webkit-slider-runnable-track {
            width: 100%;

            height: 4px;

            background: transparent;

            border: none;

            border-radius: 2px;
        }


        /* =========================================================
           CHROME / EDGE SLIDER THUMB
           ========================================================= */

        #progress::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;

            width: 12px;
            height: 12px;

            margin-top: -4px;

            border-radius: 50%;

            border: none;

            background: white;

            cursor: pointer;
        }


        /* =========================================================
           FIREFOX TRACK
           ========================================================= */

        #progress::-moz-range-track {
            width: 100%;

            height: 4px;

            background: transparent;

            border: none;

            border-radius: 2px;
        }


        /* =========================================================
           FIREFOX PROGRESS
           ========================================================= */

        #progress::-moz-range-progress {
            background: transparent;
        }


        /* =========================================================
           FIREFOX THUMB
           ========================================================= */

        #progress::-moz-range-thumb {
            width: 12px;
            height: 12px;

            border-radius: 50%;

            border: none;

            background: white;

            cursor: pointer;
        }


        /* =========================================================
           TIME
           ========================================================= */

        .time {
            width: 100%;

            display: flex;

            justify-content: space-between;

            margin-top: 5px;

            color: #888;

            font-size: 12px;
        }


        /* =========================================================
           NETWORK
           ========================================================= */

        .network-info {
            text-align: center;

            margin-top: 6px;

            color: #666;

            font-size: 11px;
        }


        /* =========================================================
           MAIN CONTROLS
           ========================================================= */

/* MAIN CONTROL ROW */

.controls {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    margin-top: 20px;
    gap: 10px;
}

/* SHUFFLE AND REPEAT — LEFT */

.left-controls {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: 6px;
}

.toggle-button {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 8px;
    background: #171717;
    color: #888;
    border: 1px solid #333;
    border-radius: 7px;
    cursor: pointer;
    font-size: 11px;
    white-space: nowrap;
}

.toggle-button span {
    font-size: 11px;
}

.toggle-button:hover {
    background: #222;
    color: white;
}

.toggle-button.active {
    background: #303030;
    color: white;
    border-color: #777;
}

/* PREVIOUS, PLAY, NEXT — CENTER */

.main-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
}

.control-button {
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 50%;
    background: none;
    color: white;
    cursor: pointer;
    font-size: 25px;
}

.control-button:hover {
    background: rgba(255, 255, 255, 0.1);
}

#playButton {
    width: 60px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: white;
    color: black;
    font-size: 25px;
    cursor: pointer;
    flex-shrink: 0;
}

#playButton:hover {
    background: #ddd;
}

/* VOLUME — RIGHT */

.right-controls {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
}

#volume {
    width: 100px;
    cursor: pointer;
}

/* EXTRA CONTROLS */

.extra-controls {
    width: 100%;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-top: 12px;
}

.right-controls {
    display: flex;
    align-items: center;
    gap: 12px;
}

#volume {
    width: 100px;
}

.toggle-button {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 8px;
    background: #171717;
    color: #888;
    border: 1px solid #333;
    border-radius: 7px;
    cursor: pointer;
    font-size: 11px;
    white-space: nowrap;
}

.toggle-button:hover {
    background: #222;
    color: white;
}

.toggle-button.active {
    background: #303030;
    color: white;
    border-color: #777;
}

.toggle-button span {
    font-size: 11px;
}

#volume {
    width: 100px;
}


        /* =========================================================
           MOBILE
           ========================================================= */

        @media (max-width: 700px) {

            body {
                overflow: auto;
            }


            .app {
                height: auto;

                min-height: 100vh;

                flex-direction: column;
            }


            .sidebar {
                width: 100%;

                min-width: 0;

                height: 400px;

                order: 2;

                border-right: none;

                border-top: 1px solid #252525;
            }


            .player-area {
                min-height: 650px;

                order: 1;
            }


            .cover-container {
                width: min(80vw, 400px);
            }


            .player-content {
                width: 90%;
            }


            #song-title {
                font-size: 20px;
            }

        }

        /* IPOD-STYLE COVER TRANSITIONS */

        .cover-stage {
            perspective: 1000px;
        }

        .cover-container,
        .side-cover {
            will-change: transform, opacity;
        }

        .cover-container {
            transition:
                transform 0.35s ease,
                opacity 0.35s ease;
        }

        .side-cover {
            transition:
                left 0.35s ease,
                right 0.35s ease,
                transform 0.35s ease,
                opacity 0.35s ease,
                filter 0.35s ease;
        }

        /* Moving to the next track */

        .cover-stage.animating-next .cover-container {
            animation: cover-out-left 0.35s ease;
        }

        .cover-stage.animating-next .next-cover {
            animation: cover-in-center 0.35s ease;
        }

        .cover-stage.animating-next .previous-cover {
            animation: side-out-left 0.35s ease;
        }

        /* Moving to the previous track */

        .cover-stage.animating-previous .cover-container {
            animation: cover-out-right 0.35s ease;
        }

        .cover-stage.animating-previous .previous-cover {
            animation: cover-in-center 0.35s ease;
        }

        .cover-stage.animating-previous .next-cover {
            animation: side-out-right 0.35s ease;
        }

        @keyframes cover-out-left {
            from { transform: translateX(0) scale(1); opacity: 1; }
            to   { transform: translateX(-100px) scale(0.82); opacity: 0.3; }
        }

        @keyframes cover-out-right {
            from { transform: translateX(0) scale(1); opacity: 1; }
            to   { transform: translateX(100px) scale(0.82); opacity: 0.3; }
        }

        @keyframes cover-in-center {
            from { transform: translateY(-50%) scale(0.78); opacity: 0.3; }
            to   { transform: translateY(-50%) scale(1); opacity: 1; }
        }

        @keyframes side-out-left {
            from { transform: translateY(-50%) scale(0.78); opacity: 0.38; }
            to   { transform: translate(-80px, -50%) scale(0.65); opacity: 0; }
        }

        @keyframes side-out-right {
            from { transform: translateY(-50%) scale(0.78); opacity: 0.38; }
            to   { transform: translate(80px, -50%) scale(0.65); opacity: 0; }
}
    </style>

</head>


<body>


<div class="app">


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside class="sidebar">


        <div class="library-header">

            <div class="library-title">
                Library
            </div>


            <input
                type="text"
                id="search"
                placeholder="Search title, artist, album, genre..."
            >

        </div>


        <div id="library"></div>


    </aside>



    <!-- =====================================================
         PLAYER
         ===================================================== -->

    <main class="player-area">


        <div
            id="background"
            class="background">
        </div>


        <div class="background-overlay"></div>



        <div class="player-content">


            
<!-- COVER CAROUSEL -->

<div class="cover-stage">

    <img
        id="previousCover"
        class="side-cover previous-cover"
        alt="Previous track cover"
    >

    <img
        id="nextCover"
        class="side-cover next-cover"
        alt="Next track cover"
    >

    <div class="cover-container">

        <img
            id="cover"
            src=""
            alt="Album cover"
        >

    </div>

</div>




            <!-- SONG INFORMATION -->

            <div class="song-info">

                <div id="song-title">
                    Nothing playing
                </div>


                <div id="song-artist">
                    —
                </div>


                <div id="song-album">
                    —
                </div>

            </div>



            <!-- PROGRESS -->

            <div class="progress-container">

                <div id="bufferBar"></div>


                <input
                    id="progress"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                >

            </div>



            <!-- TIME -->

            <div class="time">

                <span id="currentTime">
                    0:00
                </span>


                <span id="duration">
                    0:00
                </span>

            </div>



            <!-- NETWORK SPEED -->

            <div class="network-info">

                <span id="downloadSpeed">
                    Buffering: -- MB/s
                </span>

            </div>

<!-- PLAYER CONTROLS -->

<div class="controls">

    <div class="left-controls">
        <button id="shuffleButton" class="toggle-button">
            🔀 <span>Shuffle</span>
        </button>

        <button id="repeatButton" class="toggle-button">
            🔁 <span>Repeat</span>
        </button>
    </div>

    <div class="main-controls">
        <button id="previousButton" class="control-button">⏮</button>
        <button id="playButton" class="control-button">▶</button>
        <button id="nextButton" class="control-button">⏭</button>
    </div>

    <div class="right-controls">
        <span>🔊</span>
        <input
            id="volume"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="1"
        >
    </div>

</div>

<!-- =========================================================
     AUDIO ELEMENT
     ========================================================= -->

<audio id="player"></audio>



<script>


/* ============================================================
   VARIABLES
   ============================================================ */

let songs = [];

let library = {};

let currentSong = -1;

let shuffle = false;

let repeat = false;


/* ============================================================
   NETWORK / BUFFER VARIABLES
   ============================================================ */

let currentSongSize = 0;

let lastBufferedEnd = 0;

let lastSpeedTime =
    performance.now();



/* ============================================================
   HTML ELEMENTS
   ============================================================ */

const player =
    document.getElementById("player");


const cover =
    document.getElementById("cover");


const background =
    document.getElementById("background");


const songTitle =
    document.getElementById("song-title");


const songArtist =
    document.getElementById("song-artist");


const songAlbum =
    document.getElementById("song-album");


const libraryElement =
    document.getElementById("library");


const search =
    document.getElementById("search");


const progress =
    document.getElementById("progress");


const currentTime =
    document.getElementById("currentTime");


const duration =
    document.getElementById("duration");


const playButton =
    document.getElementById("playButton");


const previousButton =
    document.getElementById("previousButton");


const nextButton =
    document.getElementById("nextButton");


const volume =
    document.getElementById("volume");


const shuffleButton =
    document.getElementById("shuffleButton");


const repeatButton =
    document.getElementById("repeatButton");


const downloadSpeed =
    document.getElementById("downloadSpeed");


const bufferBar =
    document.getElementById("bufferBar");

const previousCover =
    document.getElementById("previousCover");

const nextCover =
    document.getElementById("nextCover");

const coverStage =
    document.querySelector(".cover-stage");



/* ============================================================
   LOAD MUSIC.JSON
   ============================================================ */

fetch("songs/music.json")

    .then(response => {

        if (!response.ok) {

            throw new Error(
                "Could not load music.json"
            );

        }

        return response.json();

    })

    .then(data => {

        songs = data;

        buildLibrary();

        renderLibrary();

    })

    .catch(error => {

        console.error(error);

    });



/* ============================================================
   BUILD LIBRARY
   ============================================================ */

function buildLibrary() {

    library = {};


    songs.forEach((song, index) => {

        const albumArtist =
            song.albumartist ||
            "Unknown Album Artist";


        const album =
            song.album ||
            "Unknown Album";


        if (!library[albumArtist]) {

            library[albumArtist] = {};

        }


        if (!library[albumArtist][album]) {

            library[albumArtist][album] = [];

        }


        library[albumArtist][album].push({

            ...song,

            index: index

        });

    });

}



/* ============================================================
   RENDER LIBRARY
   ============================================================ */

function renderLibrary(filter = "") {

    libraryElement.innerHTML = "";


    const query =
        filter.toLowerCase().trim();


    const albumArtists =
        Object.keys(library).sort(
            (a, b) =>
                a.localeCompare(b)
        );


    albumArtists.forEach(albumArtist => {


        const artistElement =
            document.createElement("div");

        artistElement.className =
            "artist";


        /* ARTIST HEADER */

        const artistHeader =
            document.createElement("div");

        artistHeader.className =
            "artist-header";


        artistHeader.innerHTML =
            `<span class="artist-arrow">▶</span>
             ${escapeHTML(albumArtist)}`;


        artistElement.appendChild(
            artistHeader
        );



        /* ALBUMS */

        const albumsElement =
            document.createElement("div");

        albumsElement.className =
            "albums";


        const albums =
            Object.keys(
                library[albumArtist]
            ).sort(
                (a, b) =>
                    a.localeCompare(b)
            );


        albums.forEach(album => {


            const albumSongs =
                library[
                    albumArtist
                ][
                    album
                ];


            const matchingSongs =
                albumSongs.filter(song =>
                    matchesSearch(
                        song,
                        query
                    )
                );


            if (
                query &&
                matchingSongs.length === 0
            ) {

                return;

            }



            /* ALBUM */

            const albumElement =
                document.createElement("div");

            albumElement.className =
                "album";


            const albumHeader =
                document.createElement("div");

            albumHeader.className =
                "album-header";


            albumHeader.innerHTML =
                `<span class="album-arrow">▶</span>
                 ${escapeHTML(album)}`;


            albumElement.appendChild(
                albumHeader
            );



            /* SONGS */

            const songsElement =
                document.createElement("div");

            songsElement.className =
                "songs";


            const visibleSongs =
                query
                    ? matchingSongs
                    : albumSongs;


            visibleSongs.forEach(song => {


                const songElement =
                    document.createElement("div");

                songElement.className =
                    "song";


                songElement.dataset.index =
                    song.index;



                const titleElement =
                    document.createElement("span");

                titleElement.className =
                    "song-title";

                titleElement.textContent =
                    song.title ||
                    "Unknown Title";



                const artistElement =
                    document.createElement("span");

                artistElement.className =
                    "song-artist";

                artistElement.textContent =
                    song.artist ||
                    "Unknown Artist";



                songElement.appendChild(
                    titleElement
                );


                songElement.appendChild(
                    artistElement
                );



                songElement.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                        playSong(song.index);

                    }
                );


                songsElement.appendChild(
                    songElement
                );

            });


            albumElement.appendChild(
                songsElement
            );



            /* ALBUM OPEN/CLOSE */

            albumHeader.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    albumElement.classList.toggle(
                        "open"
                    );

                }
            );


            albumsElement.appendChild(
                albumElement
            );

        });


        artistElement.appendChild(
            albumsElement
        );



        /* ARTIST OPEN/CLOSE */

        artistHeader.addEventListener(
            "click",
            () => {

                artistElement.classList.toggle(
                    "open"
                );

            }
        );


        if (
            !query ||
            albumsElement.children.length > 0
        ) {

            libraryElement.appendChild(
                artistElement
            );

        }

    });


    updateSongList();

}



/* ============================================================
   SEARCH
   ============================================================ */

function matchesSearch(song, query) {

    if (!query) {

        return true;

    }


    const text = (

        (song.title || "") +
        " " +
        (song.artist || "") +
        " " +
        (song.album || "") +
        " " +
        (song.genre || "")

    ).toLowerCase();


    return text.includes(query);

}



search.addEventListener(
    "input",
    () => {

        renderLibrary(
            search.value
        );

    }
);



/* ============================================================
   PLAYBACK SEQUENCE
   ============================================================ */

function getPlaybackSequence() {

    const sequence = [];

    const albumArtists =
        Object.keys(library).sort(
            (a, b) => a.localeCompare(b)
        );

    albumArtists.forEach(albumArtist => {

        const albums =
            Object.keys(library[albumArtist]).sort(
                (a, b) => a.localeCompare(b)
            );

        albums.forEach(album => {

            library[albumArtist][album].forEach(song => {
                sequence.push(song.index);
            });

        });

    });

    return sequence;
}


/* ============================================================
   UPDATE SIDE COVERS
   ============================================================ */

function updateSideCovers() {

    const sequence = getPlaybackSequence();

    const position = sequence.indexOf(currentSong);

    if (position === -1 || sequence.length < 2) {
        previousCover.removeAttribute("src");
        nextCover.removeAttribute("src");
        return;
    }

    const previousPosition =
        (position - 1 + sequence.length) % sequence.length;

    const nextPosition =
        (position + 1) % sequence.length;

    const previousSong =
        songs[sequence[previousPosition]];

    const nextSong =
        songs[sequence[nextPosition]];


    if (previousSong.cover) {
        previousCover.src = encodeURI(previousSong.cover);
    } else {
        previousCover.removeAttribute("src");
    }

    if (nextSong.cover) {
        nextCover.src = encodeURI(nextSong.cover);
    } else {
        nextCover.removeAttribute("src");
    }

}



/* ============================================================
   PLAY SONG
   ============================================================ */

let coverAnimationTimer;

function animateCover(direction, callback) {

    // Prevent overlapping animations
    clearTimeout(coverAnimationTimer);

    coverStage.classList.remove(
        "animating-next",
        "animating-previous"
    );

    // Restart the CSS animation
    void coverStage.offsetWidth;

    coverStage.classList.add(
        direction === "next"
            ? "animating-next"
            : "animating-previous"
    );

    // Change the song after the animation
    coverAnimationTimer = setTimeout(() => {

        callback();

        coverStage.classList.remove(
            "animating-next",
            "animating-previous"
        );

    }, 350);
}

function playSong(index) {

    if (
        index < 0 ||
        index >= songs.length
    ) {

        return;

    }


    currentSong = index;
    updateSideCovers();

    const song =
        songs[currentSong];



    /* RESET NETWORK MEASUREMENT */

    currentSongSize =
        song.size || 0;


    lastBufferedEnd = 0;


    lastSpeedTime =
        performance.now();


    downloadSpeed.textContent =
        "Buffering: measuring...";



    /* RESET PROGRESS */

    progress.value = 0;


    currentTime.textContent =
        "0:00";


    duration.textContent =
        "0:00";


    bufferBar.style.width =
        "0%";



    /* AUDIO SOURCE */

    player.src =
        encodeURI(song.file);



    /* SONG INFO */

    songTitle.textContent =
        song.title ||
        "Unknown Title";


    songArtist.textContent =
        song.artist ||
        "Unknown Artist";


    const album =
        song.album ||
        "Unknown Album";


    const year =
        song.year ||
        "";


    songAlbum.textContent =
        year
            ? `${album} (${year})`
            : album;



    /* COVER */

    if (song.cover) {

        const coverURL =
            encodeURI(song.cover);


        cover.src =
            coverURL;


        background.style.backgroundImage =
            `url("${coverURL}")`;

    }
    else {

        cover.removeAttribute("src");

        background.style.backgroundImage =
            "none";

    }



    /* LOAD */

    player.load();


    player.play();


    updateSongList();

}



/* ============================================================
   PLAY / PAUSE
   ============================================================ */

playButton.addEventListener(
    "click",
    () => {


        if (!player.src) {

            if (songs.length > 0) {

                playSong(0);

            }

            return;

        }


        if (player.paused) {

            player.play();

        }
        else {

            player.pause();

        }

    }
);



/* ============================================================
   PLAY BUTTON ICON
   ============================================================ */

player.addEventListener(
    "play",
    () => {

        playButton.textContent =
            "⏸";

    }
);


player.addEventListener(
    "pause",
    () => {

        playButton.textContent =
            "▶";

    }
);



/* ============================================================
   NEXT
   ============================================================ */

nextButton.addEventListener("click", () => {
    animateCover("next", nextSong);
});



function nextSong() {

    if (songs.length === 0) {

        return;

    }



    /* REPEAT */

    if (repeat) {

        playSong(currentSong);

        return;

    }



    /* SHUFFLE */

    if (shuffle) {

        let nextIndex;


        do {

            nextIndex =
                Math.floor(
                    Math.random() *
                    songs.length
                );

        }
        while (
            songs.length > 1 &&
            nextIndex === currentSong
        );


        playSong(nextIndex);

        return;

    }



    /* NORMAL */

    const albumArtists =
        Object.keys(library).sort(
            (a, b) =>
                a.localeCompare(b)
        );


    const current =
        songs[currentSong];


    const currentArtist =
        current.albumartist ||
        "Unknown Album Artist";


    const currentAlbum =
        current.album ||
        "Unknown Album";


    const artistIndex =
        albumArtists.indexOf(
            currentArtist
        );


    if (artistIndex === -1) {

        return;

    }


    const albums =
        Object.keys(
            library[currentArtist]
        ).sort(
            (a, b) =>
                a.localeCompare(b)
        );


    const albumIndex =
        albums.indexOf(
            currentAlbum
        );


    if (albumIndex === -1) {

        return;

    }


    const currentAlbumSongs =
        library[
            currentArtist
        ][
            currentAlbum
        ];


    const trackIndex =
        currentAlbumSongs.findIndex(
            song =>
                song.index === currentSong
        );



    /* NEXT TRACK */

    if (
        trackIndex !== -1 &&
        trackIndex <
            currentAlbumSongs.length - 1
    ) {

        playSong(
            currentAlbumSongs[
                trackIndex + 1
            ].index
        );

        return;

    }



    /* NEXT ALBUM */

    if (
        albumIndex <
        albums.length - 1
    ) {

        const nextAlbum =
            albums[
                albumIndex + 1
            ];


        const nextAlbumSongs =
            library[
                currentArtist
            ][
                nextAlbum
            ];


        playSong(
            nextAlbumSongs[0].index
        );

        return;

    }



    /* NEXT ARTIST */

    if (
        artistIndex <
        albumArtists.length - 1
    ) {

        const nextArtist =
            albumArtists[
                artistIndex + 1
            ];


        const nextArtistAlbums =
            Object.keys(
                library[nextArtist]
            ).sort(
                (a, b) =>
                    a.localeCompare(b)
            );


        const firstAlbum =
            nextArtistAlbums[0];


        const firstAlbumSongs =
            library[nextArtist][
                firstAlbum
            ];


        playSong(
            firstAlbumSongs[0].index
        );

        return;

    }



    /* LOOP TO FIRST SONG */

    const firstArtist =
        albumArtists[0];


    const firstAlbums =
        Object.keys(
            library[firstArtist]
        ).sort(
            (a, b) =>
                a.localeCompare(b)
        );


    const firstAlbum =
        firstAlbums[0];


    const firstSongs =
        library[firstArtist][
            firstAlbum
        ];


    playSong(
        firstSongs[0].index
    );

}



/* ============================================================
   PREVIOUS
   ============================================================ */

previousButton.addEventListener("click", () => {
    if (songs.length === 0) return;

    const sequence = getPlaybackSequence();
    const currentPosition = sequence.indexOf(currentSong);

    if (currentPosition === -1) return;

    const previousPosition =
        (currentPosition - 1 + sequence.length) % sequence.length;

    playSong(sequence[previousPosition]);
});



/* ============================================================
   SONG ENDED
   ============================================================ */

player.addEventListener(
    "ended",
    () => {

        nextSong();

    }
);



/* ============================================================
   ELAPSED TIME
   ============================================================ */

player.addEventListener(
    "timeupdate",
    () => {


        if (
            !Number.isFinite(
                player.duration
            )
        ) {

            return;

        }


        progress.value =
            (
                player.currentTime /
                player.duration
            ) * 100;


        currentTime.textContent =
            formatTime(
                player.currentTime
            );

    }
);



/* ============================================================
   DURATION
   ============================================================ */

player.addEventListener(
    "loadedmetadata",
    () => {

        if (
            Number.isFinite(
                player.duration
            )
        ) {

            duration.textContent =
                formatTime(
                    player.duration
                );

        }


        updateBufferBar();

    }
);



/* ============================================================
   SEEK
   ============================================================ */

progress.addEventListener(
    "input",
    () => {


        if (
            !Number.isFinite(
                player.duration
            )
        ) {

            return;

        }


        player.currentTime =
            (
                progress.value /
                100
            ) *
            player.duration;


        currentTime.textContent =
            formatTime(
                player.currentTime
            );

    }
);



/* ============================================================
   VOLUME
   ============================================================ */

volume.addEventListener(
    "input",
    () => {

        player.volume =
            Number(volume.value);

    }
);



/* ============================================================
   SHUFFLE
   ============================================================ */

shuffleButton.addEventListener(
    "click",
    () => {

        shuffle =
            !shuffle;


        shuffleButton.classList.toggle(
            "active",
            shuffle
        );

    }
);



/* ============================================================
   REPEAT
   ============================================================ */

repeatButton.addEventListener(
    "click",
    () => {

        repeat =
            !repeat;


        repeatButton.classList.toggle(
            "active",
            repeat
        );

    }
);



/* ============================================================
   UPDATE ACTIVE SONG
   ============================================================ */

function updateSongList() {

    document
        .querySelectorAll(".song")
        .forEach(element => {


            const index =
                Number(
                    element.dataset.index
                );


            element.classList.toggle(
                "active",
                index === currentSong
            );

        });

}



/* ============================================================
   GET BUFFERED END
   ============================================================ */

function getBufferedEnd() {


    if (
        player.buffered.length === 0
    ) {

        return 0;

    }



    /*
     * Find the buffered range containing
     * the current playback position.
     */

    for (
        let i = 0;
        i < player.buffered.length;
        i++
    ) {


        if (
            player.currentTime >=
                player.buffered.start(i)

            &&

            player.currentTime <=
                player.buffered.end(i)
        ) {

            return player.buffered.end(i);

        }

    }



    /*
     * If current playback position isn't
     * inside a buffered range, use the
     * last buffered range.
     */

    return player.buffered.end(
        player.buffered.length - 1
    );

}



/* ============================================================
   UPDATE BUFFER BAR
   ============================================================ */

function updateBufferBar() {


    if (
        !Number.isFinite(
            player.duration
        )

        ||

        player.duration <= 0

        ||

        player.buffered.length === 0
    ) {

        bufferBar.style.width =
            "0%";

        return;

    }



    const bufferedEnd =
        getBufferedEnd();


    const percentage =
        (
            bufferedEnd /
            player.duration
        ) * 100;


    bufferBar.style.width =
        Math.min(
            100,
            percentage
        ) + "%";

}



/* ============================================================
   BUFFER EVENTS
   ============================================================ */

player.addEventListener(
    "progress",
    updateBufferBar
);


player.addEventListener(
    "loadedmetadata",
    updateBufferBar
);


player.addEventListener(
    "timeupdate",
    updateBufferBar
);



/*
 * Backup update every 250 ms.
 */

setInterval(
    updateBufferBar,
    250
);



/* ============================================================
   NETWORK SPEED
   ============================================================ */

setInterval(
    () => {


        /*
         * We need:
         *
         * 1. Song duration
         * 2. Song file size
         * 3. Some buffered data
         */

        if (
            !Number.isFinite(
                player.duration
            )

            ||

            !currentSongSize

            ||

            player.buffered.length === 0
        ) {

            downloadSpeed.textContent =
                "Buffering: -- MB/s";

            return;

        }



        const bufferedEnd =
            getBufferedEnd();


        const now =
            performance.now();


        const elapsed =
            (
                now -
                lastSpeedTime
            ) / 1000;


        const bufferedGrowth =
            bufferedEnd -
            lastBufferedEnd;



        /*
         * Buffer has grown.
         */

        if (
            elapsed > 0 &&
            bufferedGrowth > 0
        ) {


            /*
             * Estimate how many bytes
             * one second of audio represents.
             */

            const bytesPerAudioSecond =
                currentSongSize /
                player.duration;



            /*
             * How many audio seconds are
             * being buffered per real second.
             */

            const audioSecondsPerSecond =
                bufferedGrowth /
                elapsed;



            /*
             * Estimated bytes per second.
             */

            const bytesPerSecond =
                bytesPerAudioSecond *
                audioSecondsPerSecond;



            const mbPerSecond =
                bytesPerSecond /
                (1024 * 1024);



            downloadSpeed.textContent =
                "Buffering: " +
                mbPerSecond.toFixed(2) +
                " MB/s";

        }

        else {

            downloadSpeed.textContent =
                "Buffering: 0.00 MB/s";

        }



        /*
         * Save measurement.
         */

        lastBufferedEnd =
            bufferedEnd;


        lastSpeedTime =
            now;


    },
    250
);



/* ============================================================
   FORMAT TIME
   ============================================================ */

function formatTime(seconds) {


    if (
        !Number.isFinite(seconds)
    ) {

        return "0:00";

    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return (
        minutes +
        ":" +
        secs
            .toString()
            .padStart(2, "0")
    );

}



/* ============================================================
   HTML ESCAPING
   ============================================================ */

function escapeHTML(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}

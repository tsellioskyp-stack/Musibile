<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Music</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #111;
            color: white;
        }

        .container {
            width: 500px;
            max-width: 90vw;

            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
        }

        select {
            width: 100%;
            padding: 12px;

            font-size: 16px;

            margin-bottom: 20px;
        }

        /* Album artwork / player background */

        .player-box {

            position: relative;

            width: 100%;
            aspect-ratio: 1 / 1;

            overflow: hidden;

            display: flex;
            flex-direction: column;

            justify-content: flex-end;

            background: #222;
        }

        #cover {

            position: absolute;

            width: 100%;
            height: 100%;

            object-fit: cover;

            top: 0;
            left: 0;

            z-index: 0;
        }

        /* Dark overlay so controls remain visible */

        .overlay {

            position: absolute;

            width: 100%;
            height: 100%;

            background: linear-gradient(
                transparent 40%,
                rgba(0,0,0,0.85)
            );

            z-index: 1;
        }

        .player-content {

            position: relative;

            z-index: 2;

            padding: 20px;
        }

        #nowPlaying {

            font-size: 20px;
            font-weight: bold;

            margin-bottom: 15px;

            text-shadow: 0 2px 5px black;
        }

        audio {

            width: 100%;

            margin-bottom: 15px;
        }

        .buttons {

            display: flex;

            justify-content: center;

            gap: 20px;
        }

        button {

            padding: 10px 25px;

            border: none;

            font-size: 16px;

            cursor: pointer;

            border-radius: 5px;
        }

        button:hover {
            background: #ddd;
        }

        #songList {

            margin-top: 20px;

            max-height: 250px;

            overflow-y: auto;

            text-align: left;

            background: #1b1b1b;
        }

        .song {

            padding: 12px;

            border-bottom: 1px solid #333;

            cursor: pointer;
        }

        .song:hover {
            background: #292929;
        }

        .song.active {

            background: #444;

            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="container">

    <h1>My Music</h1>


    <!-- Album dropdown -->

    <select id="albumSelect">

        <option value="">
            Select an album
        </option>

    </select>


    <!-- Player -->

    <div class="player-box">

        <img id="cover" src="" alt="Album cover">

        <div class="overlay"></div>


        <div class="player-content">

            <div id="nowPlaying">
                Nothing playing
            </div>


            <audio id="player" controls>
                Your browser does not support audio.
            </audio>


            <div class="buttons">

                <button id="previous">
                    ⏮ Previous
                </button>

                <button id="next">
                    Next ⏭
                </button>

            </div>

        </div>

    </div>


    <!-- Songs -->

    <div id="songList"></div>

</div>



<script>


let songs = [];

let albumSongs = [];

let currentSong = 0;


// HTML elements

const albumSelect =
    document.getElementById("albumSelect");

const songList =
    document.getElementById("songList");

const player =
    document.getElementById("player");

const cover =
    document.getElementById("cover");

const nowPlaying =
    document.getElementById("nowPlaying");



// Load music.json

fetch("music.json")

    .then(response => response.json())

    .then(data => {

        songs = data;

        createAlbumList();

    })

    .catch(error => {

        console.error(
            "Could not load music.json:",
            error
        );

    });



// Create album dropdown

function createAlbumList() {

    const albums = [];

    songs.forEach(song => {

        if (!albums.includes(song.album)) {

            albums.push(song.album);

        }

    });


    albums.sort();


    albums.forEach(album => {

        const option =
            document.createElement("option");

        option.value = album;

        option.textContent = album;

        albumSelect.appendChild(option);

    });

}



// Album selected

albumSelect.addEventListener(
    "change",
    function () {

        const selectedAlbum =
            this.value;

        albumSongs =
            songs.filter(
                song =>
                    song.album === selectedAlbum
            );

        currentSong = 0;

        displaySongs();

    }
);



// Display songs from selected album

function displaySongs() {

    songList.innerHTML = "";


    albumSongs.forEach(
        (song, index) => {

            const div =
                document.createElement("div");

            div.className = "song";

            div.textContent =
                (index + 1) +
                ". " +
                song.title;


            div.addEventListener(
                "click",
                () => {

                    playSong(index);

                }
            );


            songList.appendChild(div);

        }
    );

}



// Play song

function playSong(index) {

    if (index < 0) {

        index =
            albumSongs.length - 1;

    }


    if (index >= albumSongs.length) {

        index = 0;

    }


    currentSong = index;


    const song =
        albumSongs[currentSong];


    player.src =
        encodeURI(song.file);


    nowPlaying.textContent =
        song.artist +
        " — " +
        song.title;


    // Change artwork

    if (song.cover) {

        cover.src =
            encodeURI(song.cover);

    }


    updateSongList();


    player.play();

}



// Highlight current song

function updateSongList() {

    const list =
        document.querySelectorAll(
            ".song"
        );


    list.forEach(
        (element, index) => {

            element.classList.toggle(
                "active",
                index === currentSong
            );

        }
    );


    if (list[currentSong]) {

        list[currentSong]
            .scrollIntoView({
                behavior: "smooth",
                block: "nearest"
            });

    }

}



// Previous

document
    .getElementById("previous")
    .addEventListener(
        "click",
        () => {

            playSong(
                currentSong - 1
            );

        }
    );



// Next

document
    .getElementById("next")
    .addEventListener(
        "click",
        () => {

            playSong(
                currentSong + 1
            );

        }
    );



// Automatically play next song

player.addEventListener(
    "ended",
    () => {

        playSong(
            currentSong + 1
        );

    }
);


</script>


</body>
</html>
